name: Build & Deploy Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:     # manual trigger from GitHub UI

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build entries.json → Vercel

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build entries.json from markdown files
        run: python3 scripts/build-wiki.py

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -lh public/data/
          echo ""
          echo "=== Entry count ==="
          python3 -c "
          import json
          with open('public/data/entries.json') as f:
            d = json.load(f)
          print(f'  {d[\"meta\"][\"totalEntries\"]} entries built')
          print(f'  Build time: {d[\"meta\"][\"buildTime\"]}')
          print(f'  Categories: {len(d[\"meta\"][\"categories\"])}')
          "

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          cd public
          vercel deploy --prod --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes

      - name: Deployment summary
        run: |
          echo "✅ Wiki deployed to Vercel"
          echo "   Every push to main triggers a fresh build"
          echo "   Cache headers ensure visitors always get latest"

  # ── FAILURE ALERTING ────────────────────────────────────────────────
  # Runs ONLY when build-and-deploy fails.
  # Sends a Telegram message so you know immediately.
  #
  # SETUP (one-time, takes 3 minutes):
  #   1. On Telegram: message @BotFather → /newbot → follow prompts
  #      Copy the token it gives you (looks like 123456:ABCdef...)
  #   2. Start a chat with your new bot (search its name, hit Start)
  #   3. Visit in browser (replace YOUR_TOKEN):
  #      https://api.telegram.org/botYOUR_TOKEN/getUpdates
  #      Find "chat":{"id": — copy that number (your CHAT_ID)
  #   4. Add to GitHub repo → Settings → Secrets → Actions → New secret:
  #      TELEGRAM_BOT_TOKEN  =  the token from step 1
  #      TELEGRAM_CHAT_ID    =  the id from step 3
  #
  # If you don't use Telegram, delete this job and the notify-on-success
  # job below. Failure will still show in GitHub Actions UI.
  # ────────────────────────────────────────────────────────────────────
  notify-on-failure:
    runs-on: ubuntu-latest
    name: Alert on failure
    needs: build-and-deploy
    if: failure()

    steps:
      - name: Send Telegram failure alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="❌ *AI Wiki Deploy Failed*

          *Repo:* ${{ github.repository }}
          *Commit:* \`${{ github.sha }}\`
          *Triggered by:* ${{ github.actor }}
          *Time:* $(date -u '+%Y-%m-%d %H:%M UTC')

          [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          Common causes:
          · Vercel token expired → check repo Secrets
          · Broken .md file → run build-wiki.py locally
          · Python error → check build step in the log above"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview="true"

  # ── SUCCESS SUMMARY ─────────────────────────────────────────────────
  # Optional: brief confirmation after every successful deploy.
  # Comment out if you find it noisy — failure alerts are the critical ones.
  # ────────────────────────────────────────────────────────────────────
  notify-on-success:
    runs-on: ubuntu-latest
    name: Confirm deployment
    needs: build-and-deploy
    if: success()

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build for count
        run: python3 scripts/build-wiki.py

      - name: Send Telegram success ping
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ENTRY_COUNT=$(python3 -c "
          import json
          with open('public/data/entries.json') as f:
            d = json.load(f)
          print(d['meta']['totalEntries'])
          ")

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="✅ Wiki deployed — ${ENTRY_COUNT} entries live"
